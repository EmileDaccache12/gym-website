<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emile's Gym Website/form</title>

    <style>
        #main-h1 {
            text-align: center;
            font-size: 400%;
            font-weight: bolder;
            font-family: Berlin Sans FB , 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #return {
            float: right;
        }

        #main{
            margin: auto;
            width: 71%;
            height: auto;
            border: 2.15px solid rgb(219, 219, 219);
            padding: 40px;
            border-radius: 10px;
        }

        select {
            width: 70%;
            height: auto;
            font-size: large;
            cursor: pointer;
        }

        input {
            font-size: large;
            width: 100%;
            height: auto;
        }

        .rows {
            display: flex;
            margin-bottom: 60px;
            gap: 30px;
        }

        .container {
            margin: auto;
            display: flex;
            gap: 30px;
        }

        #submit {
            width: 85%;
            height: auto;
            font-size: xx-large;
            text-align: center;
            margin: auto;
            padding: 3px;
        }

        #submit:hover {
            transform: scale(1.03);
            cursor: pointer;
        }

        @media (max-width: 700px) {
            #main-h1 {
                font-size: 300%;
            }

            input , select {
                font-size: medium;
            }

            #main {
                width: 85%;
                padding: 25px;
            }

            .rows {
                gap: 15px;
            }
        }
        
    </style>

    <script>
        document.addEventListener("DOMContentLoaded" , function () {
            document.querySelector("#submit").addEventListener("click" , function () {
                alert("Your form has been submitted");
            });
        });

        console.log(
            "this is the console"
        )
    </script>
</head>
<body>
    <div id="heading">
        <h1 id="main-h1">APPLICATION FORM</h1>
        <a href="gym-site-home.html">
            <button id="return">Home</button>
        </a>
    </div>

    <div id="main">
        <div id="row1" class="rows">
            <select name="year" id="year">
                <option value="placeholder" disabled selected>Birth Year</option>
            </select>
            <script> //years
                const select1 = document.getElementById("year");

                for (let year = 1961; year <= 2014; year++) {
                    const option = document.createElement("option");
                    option.value = year;
                    option.textContent = year;
                    select1.appendChild(option);
                }
            </script>

            <select name="month" id="month">
                <option value="placeholder" disabled selected>Birth Month</option>
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">september</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>

            <select name="day" id="day">
                <option value="placeholder" disabled selected>Birth Year</option>
            </select>
            <script> //days
                const select2 = document.getElementById("day");

                for (let year = 1; year <= 31; year++) {
                    const option = document.createElement("option");
                    option.value = year;
                    option.textContent = year;
                    select2.appendChild(option);
                }
            </script>
        </div>

        <div id="row2" class="rows">
            <div class="container">
                <div class="stack">
                    <label for="input">Enter First Name</label>
                    <input type="text" placeholder="First Name">
                </div>

                <div class="stack">
                    <label for="input">Enter Last Name</label>
                    <input type="text" placeholder="Last Name">
                </div>
            </div>
        </div>

        <div id="row3" class="rows">
            <div class="container">
                <div class="stack">
                    <label for="input">Enter Email</label>
                    <input type="text" placeholder="example@gmail.com" id="email">
                </div>

                <div class="stack">
                    <label for="input">Enter Phone</label>
                    <input type="text" placeholder="Phone Number" id="phone">
                </div>
            </div>
        </div>

        <div id="row4" class="rows">
            <button id="submit">SUBMIT</button>
        </div>
    </div>
</body>
</html>
